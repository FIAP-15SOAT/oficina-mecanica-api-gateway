openapi: "3.0.1"

info:
  title: ${api_name}
  description: API Gateway da solução Oficina Mecanica.
  version: "1.0.0"

# Each route group uses the integration of the same name, which targets the
# group's owner in `route_owner`. There is no catch-all and no /internal path.
paths:
  /customer-auth/login:
    post:
      summary: Autenticação de clientes
      description: Gera um access token para autenticação externa de clientes (sem acesso administrativo).
      responses:
        default:
          description: Resposta produzida pela função serverless, encaminhada sem alteração.
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/lambda"

  /api/auth/login:
    post:
      summary: Autenticação de usuários internos
      description: >-
        Gera um access token e um refresh token para usuários internos (funcionários). Rota própria para o limite de frequência de login.
      responses:
        default:
          description: Resposta produzida pelo serviço dono, encaminhada sem alteração.
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/auth"

  /api/auth/{proxy+}:
    x-amazon-apigateway-any-method:
      summary: Autenticação de usuários internos (demais operações)
      parameters:
        - name: proxy
          in: path
          required: true
          description: Restante do caminho, encaminhado ao serviço dono.
          schema:
            type: string
      responses:
        default:
          description: Resposta produzida pelo serviço dono, encaminhada sem alteração.
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/auth"

  /api/users:
    x-amazon-apigateway-any-method:
      summary: Usuários internos
      responses:
        default:
          description: Resposta produzida pelo serviço dono, encaminhada sem alteração.
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/users"

  /api/users/{proxy+}:
    x-amazon-apigateway-any-method:
      summary: Usuários internos (subcaminhos)
      parameters:
        - name: proxy
          in: path
          required: true
          description: Restante do caminho, encaminhado ao serviço dono.
          schema:
