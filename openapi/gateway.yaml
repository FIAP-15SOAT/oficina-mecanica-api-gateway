          description: Resposta produzida pelo serviço dono, encaminhada sem alteração.
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/users"

  /api/users/{userId}/customers:
    get:
      summary: Clientes vinculados a um usuário
      description: >-
        Rota exata: o dono pode diferir do dono do prefixo `users`; os demais métodos seguem a rota do prefixo.
      parameters:
        - name: userId
          in: path
          required: true
          description: Identificador do usuário.
          schema:
            type: string
      responses:
        default:
          description: Resposta produzida pelo serviço dono, encaminhada sem alteração.
      x-amazon-apigateway-integration:
        $ref: "#/components/x-amazon-apigateway-integrations/users-customers"

  /api/me:
    get:
      summary: Perfil do cliente autenticado
      description: >-
        Rota exata: só o GET é publicado em `/api/me`.
      responses:
        default:
          description: Resposta produzida pelo serviço dono, encaminhada sem alteração.
      x-amazon-apigateway-integration:
